<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
%sveltekit.head%
		<script>
			// ?notrack stops GoatCounter counting in this browser, ?track re-enables it.
			// count.js itself skips hits while localStorage.skipgc === 't'.
			try {
				const params = new URLSearchParams(location.search);
				if (params.has('notrack')) localStorage.setItem('skipgc', 't');
				if (params.has('track')) localStorage.removeItem('skipgc');
			} catch {}
		</script>
		<script
			data-goatcounter="https://foodshed.goatcounter.com/count"
			async
			src="https://gc.zgo.at/count.js"
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
